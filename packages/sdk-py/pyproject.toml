[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "midsphere"
version = "0.1.0"
description = "Official Python SDK for midsphere — run agents, stream progress, manage end users and ratings."
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "httpx>=0.27,<1",
    "httpx-sse>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://midsphere.com"
Repository = "https://github.com/midsphere/sdk-py"

[tool.hatch.build.targets.wheel]
packages = ["src/midsphere"]

[tool.hatch.build.targets.wheel.force-include]
"src/midsphere/py.typed" = "midsphere/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
