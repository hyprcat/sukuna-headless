jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: Midsphere-AI/sukuna-headless
      branch: main
    source_dir: packages/backend
    dockerfile_path: Dockerfile
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: SERVICE_TYPE
        value: "migrate"
        scope: RUN_TIME
      - key: ENVIRONMENT
        value: "prod"
        scope: RUN_TIME
      - key: SECRET_KEY
        type: SECRET
        scope: RUN_TIME
      - key: ALLOWED_HOSTS
