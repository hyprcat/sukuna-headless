x-backend-base: &backend-base
  build:
    context: ./packages/backend
  env_file: .env.local
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sukuna
      POSTGRES_USER: sukuna
      POSTGRES_PASSWORD: sukuna
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sukuna"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/sukuna;
      mc anonymous set download local/sukuna/static;
      exit 0;
      "
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    <<: *backend-base
    environment:
      SERVICE_TYPE: migrate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  backend:
    <<: *backend-base
    environment:
      SERVICE_TYPE: web
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: *backend-base
    environment:
      SERVICE_TYPE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *backend-base
    environment:
      SERVICE_TYPE: beat
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./packages/frontend
      args:
        PUBLIC_MS_TELEMETRY: "off"
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      API_URL: http://backend:8000
      CLIENT_API_URL: http://localhost:8000
    ports:
      - "4321:4321"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
